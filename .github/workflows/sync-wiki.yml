name: Sync lab wiki from Gitee

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest wiki from Gitee
        run: |
          rm -rf /tmp/yelab-wiki
          git clone --depth 1 https://gitee.com/ye-lab/yelab-wiki.git /tmp/yelab-wiki
          rsync -a --delete --exclude='.git' /tmp/yelab-wiki/ wiki/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from gitee.com/ye-lab/yelab-wiki"
            git push
          fi
